name: Release workflow

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-archive:
    name: Build archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build project
        run: |
          cd /home/runner/work/uninstall/
          rm -rf uninstall/.git*
          tar -zcvf uninstall-${{ github.ref_name }}.tgz uninstall

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: uninstall-${{ github.ref_name }}.tgz
          path: /home/runner/work/uninstall/uninstall-${{ github.ref_name }}.tgz
          
  release:
    runs-on: ubuntu-latest
    needs:
      - build-archive
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: ./dist/*
          body: "New release is available"
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true

